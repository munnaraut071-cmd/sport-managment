services:
  # Backend Service
  - type: web
    name: sportkits-backend
    runtime: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        fromDatabase:
          name: sportkits-mongodb
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: REDIS_URL
        fromService:
          type: redis
          name: sportkits-redis
          property: connectionString
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: sportkits-ai
          property: url
    healthCheckPath: /health
    autoDeploy: true

  # Frontend Service
  - type: web
    name: sportkits-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: sportkits-backend
          property: url
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: sportkits-backend
          property: url
    autoDeploy: true

  # AI Service
  - type: web
    name: sportkits-ai
    runtime: python
    buildCommand: cd ai-service && pip install -r requirements.txt
    startCommand: cd ai-service && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_API_URL
        fromService:
          type: web
          name: sportkits-backend
          property: url
    autoDeploy: true

  # Redis Cache
  - type: redis
    name: sportkits-redis
    ipAllowList: []

  # Background Worker
  - type: worker
    name: sportkits-worker
    runtime: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && node workers/jobProcessor.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        fromDatabase:
          name: sportkits-mongodb
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: sportkits-redis
          property: connectionString
    autoDeploy: true

databases:
  - name: sportkits-mongodb
    databaseName: sportkits
    user: sportkits
    plan: standard

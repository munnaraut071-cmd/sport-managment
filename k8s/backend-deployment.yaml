apiVersion: apps/v1
kind: Deployment
metadata:
  name: sportkits-backend
  namespace: sportkits
  labels:
    app: sportkits-backend
    component: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sportkits-backend
  template:
    metadata:
      labels:
        app: sportkits-backend
        component: api
    spec:
      containers:
      - name: backend
        image: sportkits/backend:latest
        ports:
        - containerPort: 5001
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "5001"
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: mongodb-uri
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: jwt-secret
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: AI_SERVICE_URL
          value: "http://sportkits-ai:8000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sportkits-backend
  namespace: sportkits
  labels:
    app: sportkits-backend
spec:
  selector:
    app: sportkits-backend
  ports:
  - port: 5001
    targetPort: 5001
    name: http
  type: ClusterIP
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: sportkits
type: Opaque
stringData:
  mongodb-uri: "mongodb://sportkits:changeme-in-production@mongodb:27017/sportkits?authSource=admin"
  jwt-secret: "change-this-secret-in-production"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sportkits-backend-hpa
  namespace: sportkits
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sportkits-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

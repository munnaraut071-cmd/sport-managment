apiVersion: apps/v1
kind: Deployment
metadata:
  name: sportkits-frontend
  namespace: sportkits
  labels:
    app: sportkits-frontend
    component: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sportkits-frontend
  template:
    metadata:
      labels:
        app: sportkits-frontend
        component: web
    spec:
      containers:
      - name: frontend
        image: sportkits/frontend:latest
        ports:
        - containerPort: 80
          name: http
        env:
        - name: VITE_API_URL
          value: "/api"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sportkits-frontend
  namespace: sportkits
  labels:
    app: sportkits-frontend
spec:
  selector:
    app: sportkits-frontend
  ports:
  - port: 80
    targetPort: 80
    name: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sportkits-frontend-hpa
  namespace: sportkits
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sportkits-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

apiVersion: apps/v1
kind: Deployment
metadata:
  name: sportkits-ai
  namespace: sportkits
  labels:
    app: sportkits-ai
    component: ai
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sportkits-ai
  template:
    metadata:
      labels:
        app: sportkits-ai
        component: ai
    spec:
      containers:
      - name: ai
        image: sportkits/ai:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: PORT
          value: "8000"
        - name: NODE_API_URL
          value: "http://sportkits-backend:5001"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sportkits-ai
  namespace: sportkits
  labels:
    app: sportkits-ai
spec:
  selector:
    app: sportkits-ai
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sportkits-ai-hpa
  namespace: sportkits
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sportkits-ai
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80

version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: sportkits-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: sportkits
    volumes:
      - mongodb_data:/data/db
    networks:
      - sportkits-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sportkits-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MONGODB_URI=mongodb://mongodb:27017/sportkits
      - JWT_SECRET=your_production_jwt_secret_here
      - JWT_EXPIRE=7d
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb
    networks:
      - sportkits-network
    volumes:
      - backend_logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sportkits-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - sportkits-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: sportkits-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NODE_API_URL=http://backend:5001
    depends_on:
      - backend
    networks:
      - sportkits-network

volumes:
  mongodb_data:
  backend_logs:

networks:
  sportkits-network:
    driver: bridge

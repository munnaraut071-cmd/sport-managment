<!DOCTYPE html>
<html>
<head>
  <title>Dashboard Test - Auto Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      text-align: center;
      padding: 40px;
      background: #1e293b;
      border-radius: 16px;
      max-width: 500px;
    }
    h1 { color: #10b981; margin-bottom: 20px; }
    .btn {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-admin {
      background: linear-gradient(135deg, #10b981, #06b6d4);
      color: white;
    }
    .btn-dashboard {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
    }
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      font-size: 14px;
    }
    .status.success { background: #10b981; }
    .status.error { background: #ef4444; }
    .info { margin-top: 20px; padding: 15px; background: rgba(16, 185, 129, 0.1); border-radius: 8px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Dashboard Test Login</h1>
    
    <button class="btn btn-admin" onclick="loginAndGoToDashboard()">
      Auto Login & Go to Dashboard
    </button>
    
    <button class="btn btn-dashboard" onclick="justGoToDashboard()">
      Just Go to Dashboard (if already logged in)
    </button>
    
    <div id="status"></div>
    
    <div class="info">
      <strong>Steps:</strong><br>
      1. Click "Auto Login" button<br>
      2. Wait for success message<br>
      3. Dashboard will open automatically
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:5001/api';
    
    function showStatus(msg, type) {
      const status = document.getElementById('status');
      status.className = 'status ' + type;
      status.textContent = msg;
    }
    
    async function loginAndGoToDashboard() {
      showStatus('Logging in...', 'success');
      
      try {
        // Try admin login
        const response = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            email: 'admin@sportkits.com', 
            password: 'Admin@123' 
          })
        });
        
        const data = await response.json();
        
        if (data.success) {
          // Save token
          localStorage.setItem('authToken', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          
          showStatus('Login successful! Opening dashboard...', 'success');
          
          // Go to dashboard after 1 second
          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 1000);
        } else {
          showStatus('Login failed: ' + data.message, 'error');
        }
      } catch (error) {
        showStatus('Error: ' + error.message, 'error');
      }
    }
    
    function justGoToDashboard() {
      window.location.href = '/dashboard';
    }
  </script>
</body>
</html>
